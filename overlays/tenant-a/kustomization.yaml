apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tenant-a

resources:
  - ../../base

# Pin tenant-a to nginx v1.0 (stable)
images:
  - name: nginx
    newTag: "1.25.0"

# Tenant-specific labels on all resources
commonLabels:
  tenant: tenant-a

# Scale down for demo purposes
replicas:
  - name: demo-app
    count: 1

patches:
  - patch: |-
      - op: replace
        path: /metadata/name
        value: demo-app-tenant-a
    target:
      kind: Deployment
      name: demo-app
  - patch: |-
      - op: replace
        path: /metadata/name
        value: demo-app-tenant-a
    target:
      kind: Service
      name: demo-app
